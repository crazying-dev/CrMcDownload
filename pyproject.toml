[project]
name = "offcraft"
version = "0.1.0"
description = "CrMcDownload - Minecraft launcher client (download, install, offline launch)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = []

[tool.uv]
# 纯应用工程：不构建 wheel，运行期零第三方依赖
package = false
# 使用本机已有解释器，避免 uv 去下载独立 Python
python-preference = "only-system"
