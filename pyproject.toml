[project]
name = "offcraft-server"
version = "0.1.0"
description = "CrMcDownload - Minecraft mirror server (proxy + cache)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# 皮肤 PNG 校验依赖 Pillow；探测走标准库 asyncio
dependencies = ["pillow>=10"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# 纯应用工程：不构建 wheel；除 Pillow 外无其他运行期第三方依赖
package = false
python-preference = "only-system"
